<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <style>
      .bg-mint { fill: #e8f3ed; }
      .green-band { fill: #0a6b32; }
      .yellow-strip { fill: #f5a61d; }
      .text-yayasan { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 700; font-size: 23px; fill: #0a6b32; }
      .text-title { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 900; font-size: 44px; fill: #f3a010; letter-spacing: 0.5px; }
      .text-sub { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 600; font-size: 20px; fill: #1c2b23; }
      .text-contact { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #111e18; }
      .bottom-line { stroke: #000000; stroke-width: 4; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="240" class="bg-mint" />

  <!-- Top Decorative Stripes -->
  <!-- Dark Green Header Bar -->
  <polygon points="500,0 1200,0 1200,65 520,65" class="green-band" />
  <!-- Golden Yellow Diagonal Accent -->
  <polygon points="100,0 480,0 520,65 200,65" class="yellow-strip" />

  <!-- Left Logo (Geometric Islamic Calligraphy Emblem) -->
  <g transform="translate(60, 20)">
    <!-- Book & Crescent Base -->
    <path d="M 30,120 Q 75,140 120,120 Q 165,140 210,120 Q 165,155 120,140 Q 75,155 30,120 Z" fill="#0a6b32" />
    <path d="M 40,115 Q 75,128 120,115 Q 165,128 200,115 Q 165,138 120,128 Q 75,138 40,115 Z" fill="#f5a61d" />
    
    <!-- Quran Book / Pen Center -->
    <polygon points="120,95 112,125 120,135 128,125" fill="#f5a61d" />

    <!-- Geometric Calligraphy Diamond Emblem -->
    <g transform="translate(120, 60) rotate(45)">
      <rect x="-32" y="-32" width="64" height="64" fill="none" stroke="#f5a61d" stroke-width="10" />
      <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#f5a61d" stroke-width="6" />
      <rect x="-8" y="-8" width="16" height="16" fill="#f5a61d" />
    </g>

    <!-- Subtitle Logo Text -->
    <text x="120" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#0a6b32">SMP QUR'AN AL-HAMIDY</text>
    <text x="120" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555555">Menerangi Dengan Ilmu, Memanungi Dengan Hati</text>
  </g>

  <!-- Center School Information -->
  <g transform="translate(260, 20)">
    <!-- Yayasan Name -->
    <text x="0" y="70" class="text-yayasan">Yayasan Alhamidy Pringsewu</text>
    
    <!-- Main School Name -->
    <text x="0" y="118" class="text-title">SMP QUR'AN AL-HAMIDY</text>
    
    <!-- Operational License -->
    <text x="0" y="152" class="text-sub">SK Izin Operasional No : 003/KPTS-PSPD/D.14/2022</text>
    
    <!-- NPSN & Accreditation -->
    <text x="0" y="182" class="text-sub"><tspan font-weight="700">NPSN : 70035673</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan font-weight="700">Akreditasi : A</tspan></text>
  </g>

  <!-- Right Contact Information -->
  <g transform="translate(1110, 105)" text-anchor="end">
    <!-- Phone -->
    <g transform="translate(0, 0)">
      <text x="-32" y="16" class="text-contact">0812 7444 4248</text>
      <circle cx="-10" cy="10" r="14" fill="#0a6b32" />
      <!-- Phone Icon -->
      <path d="M -15,5 C -15,13 -7,15 -5,15 C -3,15 -2,13 -4,11 C -6,9 -7,10 -9,8 C -11,6 -10,5 -12,3 C -14,1 -15,3 -15,5 Z" fill="#ffffff" transform="translate(2,0) scale(0.9)" />
    </g>

    <!-- Email -->
    <g transform="translate(0, 36)">
      <text x="-32" y="16" class="text-contact">smpquranalhamidypringsewu@gmail.com</text>
      <circle cx="-10" cy="10" r="14" fill="#0a6b32" />
      <!-- Mail Icon -->
      <rect x="-18" y="3" width="16" height="12" rx="2" fill="#ffffff" />
      <path d="M -18,4 L -10,10 L -2,4" stroke="#0a6b32" stroke-width="1.5" fill="none" />
    </g>

    <!-- Address -->
    <g transform="translate(0, 72)">
      <text x="-32" y="16" class="text-contact">Jl. Lkr Utara RT.05 RW.02 Podomoro - Pringsewu</text>
      <circle cx="-10" cy="10" r="14" fill="#0a6b32" />
      <!-- Location Icon -->
      <path d="M -10,2 C -14,2 -16,5 -16,9 C -16,14 -10,18 -10,18 C -10,18 -4,14 -4,9 C -4,5 -6,2 -10,2 Z M -10,11 C -11.1,11 -12,10.1 -12,9 C -12,7.9 -11.1,7 -10,7 C -8.9,7 -8,7.9 -8,9 C -8,10.1 -8.9,11 -10,11 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Bottom Divider Border -->
  <line x1="0" y1="238" x2="1200" y2="238" class="bottom-line" />
</svg>
